name: Native build (macOS + Windows)

# Builds the Tauri desktop app for both OSes from one source and attaches the
# (unsigned) installers to a draft GitHub Release. Tag with `native-vX.Y.Z`.
on:
  push:
    tags: ["native-v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Build frontend
        run: cd frontend && npm install --no-audit --no-fund && npm run build

      - name: Stage backend resource
        shell: bash
        run: bash native/scripts/bundle-backend.sh

      - name: Generate app icons from committed logo
        shell: bash
        run: |
          cd native
          npm install --no-audit --no-fund
          npx --yes @tauri-apps/cli icon src-tauri/icon-source.png

      - name: Bundle Node 22 runtime (M2)
        shell: bash
        run: |
          NODE_VERSION=v22.11.0
          mkdir -p native/src-tauri/resources/node
          case "${{ matrix.platform }}" in
            macos-latest)
              if [ "$(uname -m)" = "arm64" ]; then N=arm64; else N=x64; fi
              curl -fsSL "https://nodejs.org/dist/$NODE_VERSION/node-$NODE_VERSION-darwin-$N.tar.gz" -o node.tgz
              tar xzf node.tgz
              cp "node-$NODE_VERSION-darwin-$N/bin/node" native/src-tauri/resources/node/node
              chmod +x native/src-tauri/resources/node/node
              # Ad-hoc sign the bundled Node so macOS will execute it (arm64 requires a valid signature)
              codesign --force --sign - native/src-tauri/resources/node/node
              ;;
            windows-latest)
              curl -fsSL "https://nodejs.org/dist/$NODE_VERSION/node-$NODE_VERSION-win-x64.zip" -o node.zip
              unzip -q node.zip
              cp "node-$NODE_VERSION-win-x64/node.exe" native/src-tauri/resources/node/node.exe
              ;;
          esac
          ls -la native/src-tauri/resources/node

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: native
          tagName: ${{ github.ref_name }}
          releaseName: "The Vault ${{ github.ref_name }}"
          releaseDraft: true
          releaseBody: "Unsigned dev build. macOS: right-click → Open. Windows: More info → Run anyway."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
