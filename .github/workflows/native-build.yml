name: Native build (macOS + Windows)

# Builds the Tauri desktop app for both OSes from one source and attaches the
# (unsigned) installers to a draft GitHub Release. Tag with `native-vX.Y.Z`.
on:
  push:
    tags: ["native-v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Build frontend
        run: cd frontend && npm install --no-audit --no-fund && npm run build

      - name: Stamp build version
        shell: bash
        run: |
          SHA=$(git rev-parse --short HEAD)
          printf '{"version":"0.1.0","build":"%s","builtAt":"%s"}\n' "$SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > backend/version.json
          cat backend/version.json

      - name: Stage backend resource
        shell: bash
        run: bash native/scripts/bundle-backend.sh

      - name: Generate app icons from committed logo
        shell: bash
        run: |
          cd native
          npm install --no-audit --no-fund
          npx --yes @tauri-apps/cli icon src-tauri/icon-source.png

      - name: Bundle Node 22 runtime (M2)
        shell: bash
        run: |
          # Bundle the runner's already-installed Node 22 (from setup-node above).
          # It's a current 22.x where node:sqlite is unflagged — pinning an older
          # patch (e.g. 22.11) breaks because node:sqlite still needs a flag there.
          mkdir -p native/src-tauri/resources/node
          NODE_BIN="$(command -v node)"
          node --version
          case "${{ matrix.platform }}" in
            macos-latest)
              cp "$NODE_BIN" native/src-tauri/resources/node/node
              chmod +x native/src-tauri/resources/node/node
              # Ad-hoc sign so macOS will execute it (arm64 requires a valid signature)
              codesign --force --sign - native/src-tauri/resources/node/node
              ;;
            windows-latest)
              cp "$NODE_BIN" native/src-tauri/resources/node/node.exe
              ;;
          esac
          ls -la native/src-tauri/resources/node

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: native
          tagName: ${{ github.ref_name }}
          releaseName: "The Vault ${{ github.ref_name }}"
          releaseDraft: true
          releaseBody: |
            Ad-hoc signed (not notarized) desktop build of The Vault.

            **macOS:** open the .dmg, drag the app to Applications, then **right-click the app → Open → Open** the first time (don't double-click). If it says "damaged", you have an older artifact — download the latest, or see native/README.md.
            **Windows:** on first run click **More info → Run anyway**.

            First launch: open **Scan Library → 📁 Choose library folder…**, pick your 3D-print folder, then Start Scan.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
