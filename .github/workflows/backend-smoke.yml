name: Backend scan smoke test

# Boots the backend and runs a real scan on macOS + Windows for every change to
# the backend or the bundling scripts — catches scan/boot regressions before they
# ship in a native build.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'native/scripts/**'
      - '.github/scripts/smoke-scan.js'
      - '.github/workflows/backend-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend production deps
        run: cd backend && npm install --omit=dev --no-audit --no-fund
      - name: Scan smoke test
        run: node .github/scripts/smoke-scan.js
