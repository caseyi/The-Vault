name: Backend scan smoke test

# Boots the backend and runs a real scan on Linux (Docker), macOS and Windows
# (native app) for every change to the backend or the bundling scripts -
# catches scan/boot regressions before they ship.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'native/scripts/**'
      - '.github/scripts/smoke-scan.js'
      - '.github/workflows/backend-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'native/scripts/**'
      - '.github/scripts/smoke-scan.js'
      - '.github/workflows/backend-smoke.yml'
  workflow_dispatch:

concurrency:
  group: backend-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend production deps
        working-directory: backend
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Scan smoke test
        run: node .github/scripts/smoke-scan.js
