# The Vault - nginx inside the frontend container.
# Serves the React build and proxies /api and /images to the backend container.
# This file is included inside the `http {}` block of the stock nginx.conf.

# Access log WITHOUT query strings: SSE endpoints receive the Claude API key as
# `?key=...` (EventSource can't send headers), and `$request` would write it
# into `docker logs`. `$uri` is the path only.
log_format vault_noquery '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                         '"$http_user_agent" rt=$request_time';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log vault_noquery;

    # Largest JSON body the backend accepts (express.json limit: 10mb).
    client_max_body_size 10m;

    # Look the backend up through Docker's DNS at request time, so recreating
    # only the backend container (new IP) never leaves nginx pointing at a
    # stale address, and nginx still starts if the backend is briefly down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $vault_backend http://backend:3001;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # ── Streaming (Server-Sent Events) endpoints ─────────────────────────────
    # The backend also sends `X-Accel-Buffering: no`, which nginx honours
    # anywhere, but list every streaming route here so it gets long timeouts.
    # Keep in sync with every `openSSE(` / `text/event-stream` in backend/.
    location ~ ^/api/(scan/stream|models/\d+/scrape-stream|models/\d+/scrape|creators/\d+/reextract|ai/generate-tags|ai/find-images|ai/vision-tags|organize/auto-annotate)$ {
        proxy_pass $vault_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
        gzip off;
    }

    location /api/ {
        proxy_pass $vault_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI calls (classify folders, gap analysis) can take minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /images/ {
        proxy_pass $vault_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_read_timeout 120s;
    }

    # Hashed CRA assets (main.<hash>.js etc.) never change: cache for a year.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app shell must always be revalidated so a deploy shows up at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
